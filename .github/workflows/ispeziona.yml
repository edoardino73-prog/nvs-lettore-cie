name: Ispeziona libreria JP2
on: workflow_dispatch
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Scarica e descrivi
        run: |
          for v in 1.0.5; do
            curl -sSfL -o x.aar https://repo1.maven.org/maven2/dev/keiji/jp2/jp2-android/$v/jp2-android-$v.aar || echo "no aar"
            curl -sSfL -o x.pom https://repo1.maven.org/maven2/dev/keiji/jp2/jp2-android/$v/jp2-android-$v.pom && cat x.pom | head -60
          done
          mkdir a && cd a && unzip -q ../x.aar && ls -R . | head -40
          unzip -q classes.jar -d cls || true
          find cls -name '*.class' | head -40
          for c in $(find cls -name '*.class' | sed 's#cls/##;s#\.class$##;s#/#.#g' | grep -v '\$' | head -15); do javap -classpath cls -public $c; done
