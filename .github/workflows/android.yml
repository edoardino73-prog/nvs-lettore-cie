name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nvs-lettore-cie
    steps:
    - uses: actions/checkout@v4
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
    - name: Costruisci l'APK
      run: gradle assembleDebug --no-daemon --stacktrace
    - name: Carica l'APK
      uses: actions/upload-artifact@v4
      with:
        name: NVS-Lettore-CIE-apk
        path: nvs-lettore-cie/app/build/outputs/apk/debug/app-debug.apk
    - name: Prepara una bozza di release con l'APK (visibile solo a te finche' non la pubblichi)
      env:
        GH_TOKEN: ${{ github.token }}
      working-directory: .
      run: |
        cp nvs-lettore-cie/app/build/outputs/apk/debug/app-debug.apk NVS-Lettore-CIE.apk
        gh release create "apk-${{ github.run_number }}" NVS-Lettore-CIE.apk --draft --title "NVS Lettore CIE - costruzione ${{ github.run_number }}" --notes "APK di prova (debug), non ancora collaudato su una carta vera."
