name: Tablet APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ "nvs-tablet/**", ".github/workflows/tablet.yml" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nvs-tablet
    steps:
    - uses: actions/checkout@v4
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
    - name: Chiave di firma (se presente nei segreti)
      env:
        KS_B64: ${{ secrets.NVS_KS_B64 }}
        KS_PASS: ${{ secrets.NVS_KS_PASS }}
      run: |
        if [ -n "$KS_B64" ]; then
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nvs.jks"
          echo "NVS_KS_PATH=$RUNNER_TEMP/nvs.jks" >> "$GITHUB_ENV"
          echo "NVS_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "Firma con la chiave NVS"
        else
          echo "Nessuna chiave: firma di prova (le versioni non si installano una sopra l'altra)"
        fi
    - name: Costruisci l'APK
      run: gradle assembleRelease --no-daemon --stacktrace
    - name: Carica l'APK
      uses: actions/upload-artifact@v4
      with:
        name: NVS-Tablet-apk
        path: nvs-tablet/app/build/outputs/apk/release/app-release.apk
    - name: Prepara una bozza di release con l'APK
      env:
        GH_TOKEN: ${{ github.token }}
      working-directory: .
      run: |
        cp nvs-tablet/app/build/outputs/apk/release/app-release.apk NVS-Tablet.apk
        gh release create "tablet-${{ github.run_number }}" NVS-Tablet.apk --draft --title "NVS Tablet - costruzione ${{ github.run_number }}" --notes "APK dell'app NVS Tablet (chiosco + lettore CIE). Non ancora collaudato su un tablet reale."
